<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C1C18; --ink2:#535347; --mute:#68685D; --faint:#8A8A7E;
  --line:rgba(28,28,24,.08); --line2:rgba(28,28,24,.12);
  --hover:rgba(28,28,24,.06); --active:rgba(28,28,24,.08);
  --field:#FDFDFC; --sub:#FAFAF9; --chip:#F4F4F2;
  --yellow:#1C1C18; --dark:#2F2F27;
  --beige:#E8E2D8; --beigeT:#493B2C;
  --blue:#E3ECFC; --blueT:#2A4F99; --pink:#F9E3F1; --pinkT:#8A2D6B; --green:#E2F2E6; --greenT:#2B6B3E;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Inter",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;flex:none}
b,strong{font-weight:550}
:focus-visible{outline:2px solid #2A4F99;outline-offset:1px;border-radius:8px}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100vh;min-width:1280px}

/* sidebar */
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}
.side-top{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 12px 0 14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;letter-spacing:-.01em}
.logo i{width:18px;height:18px;border-radius:50%;background:#D97757;display:block}
.collapse{color:var(--mute);width:24px;height:24px;display:grid;place-items:center;border-radius:6px}
.nav{flex:1;overflow:auto;padding:0 8px 12px}
.nav a{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:13px}
.nav a:hover{background:var(--hover)}
.nav a.top{color:var(--ink);font-weight:450}
.nav a.on{background:var(--active);color:var(--ink);font-weight:450}
.nav .grp{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;color:var(--ink2);margin-top:10px}
.nav .grp .chev{margin-left:auto;color:var(--faint);width:14px;height:14px}
.nav .sub{padding-left:24px}
.nav hr{border:0;border-top:1px solid var(--line);margin:8px 6px}
.side-foot{padding:8px;border-top:1px solid var(--line)}
.hub{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.hub b{display:block;font-weight:450}
.hub .bar{height:4px;border-radius:2px;background:var(--chip);margin:8px 0 4px;overflow:hidden}
.hub .bar i{display:block;height:100%;width:67%;background:#3E8E56;border-radius:2px}
.hub small{font-size:12px;color:var(--mute)}

/* topbar */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:48px;flex:none;display:grid;grid-template-columns:1fr 470px 1fr;align-items:center;padding:0 12px}
.search{display:flex;align-items:center;gap:8px;height:32px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;color:var(--mute);background:#fff;box-shadow:0 1px 2px rgba(28,28,24,.04)}
.search span{flex:1}
.kbd{font-size:11.5px;color:var(--faint);letter-spacing:.06em}
.tb-r{justify-self:end;display:flex;align-items:center;gap:8px}
.pill{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--field);font-size:13px;white-space:nowrap}
.btn-dark{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;background:var(--dark);color:#fff;font-weight:450;white-space:nowrap}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--ink2)}
.avatar{width:28px;height:28px;border-radius:50%;background:#DCEBDD;color:#2B6B3E;display:grid;place-items:center;font-size:11.5px;font-weight:550}

/* page header */
.ph{padding:10px 16px 0 12px;border-bottom:1px solid var(--line);flex:none}
.ph-row{display:flex;align-items:center;gap:10px;min-height:32px}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.crumb a{color:var(--mute);text-decoration:none}
.ph h1{font-size:20px;line-height:28px;font-weight:450;margin:0;letter-spacing:-.005em}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:12px;font-size:12px;font-weight:450;white-space:nowrap}
.tag.beige{background:var(--beige);color:var(--beigeT)}
.tag.gray{background:var(--chip);color:var(--ink2)}
.tag.blue{background:var(--blue);color:var(--blueT)}
.tag.pink{background:var(--pink);color:var(--pinkT)}
.tag.green{background:var(--green);color:var(--greenT)}
.ph-acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--field);font-size:13px;white-space:nowrap}
.btn:hover{background:#F7F7F5}
.btn.sm{height:28px;padding:0 8px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:#fff;font-weight:450}
.btn.yellow:hover{background:#2F2F27}
.meta{font-size:12px;color:var(--mute);white-space:nowrap}
.tabs{display:flex;gap:20px;margin-top:6px}
.tabs a{padding:8px 2px 9px;color:var(--ink2);text-decoration:none;border-bottom:2px solid transparent;font-size:13px}
.tabs a.on{color:var(--ink);border-color:var(--ink);font-weight:450}

/* body: left panel + content, People-page skeleton */
.body{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr)}
.lp{border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.lp-sum{margin:12px;border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;gap:4px}
.lp-sum div{border-radius:8px;padding:6px 4px;text-align:center}
.lp-sum div.on{background:#EEF3FC}
.lp-sum b{display:block;font-weight:450;color:var(--ink)}
.lp-sum span{display:inline-block;margin-top:2px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;line-height:16px;background:var(--chip);color:var(--ink2);border-radius:12px;padding:0 6px}
.lp-sum div.on span{background:#fff}
.sec{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:450}
.sec:hover{background:var(--sub)}
.sec.on{background:var(--sub);box-shadow:inset 2px 0 0 var(--ink)}
.sec .i{color:var(--ink2)}
.sec .st{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:400;font-size:12px;color:var(--mute)}
.ok{width:16px;height:16px;border-radius:50%;background:#3E8E56;display:grid;place-items:center;flex:none}
.ok svg{width:10px;height:10px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.todo{width:16px;height:16px;border-radius:50%;border:1.5px dashed #B9B9AE;flex:none}
.lp-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px;display:flex;gap:4px;align-items:center;justify-content:space-between}
.lp-foot .link{color:var(--mute)}

.content{overflow:auto;background:var(--sub)}
.wrapc{max-width:1000px;margin:0 auto;padding:16px 24px 48px;display:flex;flex-direction:column;gap:12px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#F0F0EC;color:var(--ink)}
.banner .i{margin-top:2px;color:var(--ink2)}
.banner p{margin:0;color:var(--ink2)}
.banner .x{margin-left:auto;color:var(--mute)}
.banner a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}

.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.ch{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 12px}
.ch h2{font-size:15px;line-height:24px;font-weight:550;margin:0;display:flex;align-items:center;gap:8px}
.ch p{margin:0;color:var(--mute)}
.ch .r{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.cb{padding:0 16px 16px}
.lab{display:block;font-weight:450;margin-bottom:6px}
.lab small{font-weight:400;color:var(--mute);font-size:12px;margin-left:4px}
.help{font-size:12px;color:var(--mute);margin-top:6px;line-height:16px}

/* job card */
.jobgrid{display:grid;grid-template-columns:1.5fr 1.2fr 1fr 1fr;border:1px solid var(--line);border-radius:8px}
.jobgrid>div{padding:10px 12px;border-left:1px solid var(--line);min-width:0}
.jobgrid>div:first-child{border-left:0}
.jobgrid small{display:block;font-size:12px;color:var(--mute);line-height:16px;margin-bottom:2px}
.jobgrid span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:#3E8E56;flex:none}

/* inputs */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ta{width:100%;min-height:76px;resize:none;border:1px solid var(--line2);border-radius:8px;background:#fff;padding:8px 10px;line-height:20px;box-shadow:0 1px 2px rgba(28,28,24,.03)}
.ta:focus{outline:none;border-color:#7C9BD6;box-shadow:0 0 0 3px rgba(42,79,153,.12)}
.count{float:right;font-size:12px;color:var(--faint);font-weight:400}
.files{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border:1px dashed var(--line2);border-radius:8px;background:var(--sub)}
.file{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid var(--line2);border-radius:8px;background:var(--field);font-size:12.5px}
.file .i{width:14px;height:14px;color:var(--ink2)}
.file em{font-style:normal;color:var(--mute)}
.files .add{color:var(--ink2);display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.files .hint{color:var(--mute);font-size:12px}

/* buyers */
.buyers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.by{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:#fff}
.by:hover{border-color:var(--line2)}
.by .tags{display:flex;gap:6px;flex-wrap:wrap}
.by .who{display:flex;gap:10px;align-items:center}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:550}
.av.a1{background:#E3ECFC;color:#2A4F99}.av.a2{background:#FBE7DE;color:#9A4320}.av.a3{background:#E2F2E6;color:#2B6B3E}
.by .who b{display:block;font-weight:550;font-size:14px;line-height:20px}
.by .who small{display:block;font-size:12px;color:var(--mute);line-height:16px}
.by p{margin:0;color:var(--ink2);font-size:12.5px;line-height:18px}
.by .row{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.by .row .meta{margin-right:auto}
.by.add{border-style:dashed;align-items:center;justify-content:center;color:var(--ink2);min-height:100%}

/* skills table */
.tbl{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tr{display:grid;grid-template-columns:40px 150px minmax(0,1fr) 150px 28px;gap:12px;align-items:center;padding:0 12px;min-height:48px;border-top:1px solid var(--line)}
.tr:first-child{border-top:0}
.th{min-height:36px;background:var(--sub);font-size:12px;color:var(--mute)}
.tr .nm{font-weight:450}
.tr .def{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr.off .nm,.tr.off .def{color:var(--faint)}
.sw{width:28px;height:16px;border-radius:999px;background:#DADAD3;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--ink)}
.sw.on::after{left:14px}
.wt{display:flex;align-items:center;gap:8px}
.wt .bar{flex:1;height:4px;border-radius:2px;background:var(--chip);overflow:hidden}
.wt .bar i{display:block;height:100%;background:var(--ink)}
.num{width:52px;height:28px;border:1px solid var(--line2);border-radius:8px;background:var(--field);display:flex;align-items:center;justify-content:flex-end;padding:0 8px;font-variant-numeric:tabular-nums;gap:2px}
.num em{font-style:normal;color:var(--mute)}
.tr .more{color:var(--mute);width:28px;height:28px;display:grid;place-items:center;border-radius:8px}
.tfoot{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--sub)}
.tfoot .total{margin-left:auto;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}

/* call settings */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.select{height:32px;border:1px solid var(--line2);border-radius:8px;background:var(--field);display:flex;align-items:center;padding:0 10px;gap:8px}
.select .i{margin-left:auto;color:var(--mute);width:14px;height:14px}
.seg{display:flex;height:32px;border:1px solid var(--line2);border-radius:8px;padding:2px;background:var(--field);gap:2px}
.seg span{flex:1;display:grid;place-items:center;border-radius:6px;color:var(--ink2)}
.seg span.on{background:var(--active);color:var(--ink);font-weight:450}
.checks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.ck{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px}
.box{width:16px;height:16px;border-radius:4px;border:1px solid #B9B9AE;background:#fff;flex:none;display:grid;place-items:center}
.box.on{background:var(--ink);border-color:var(--ink)}
.box.on svg{width:10px;height:10px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.divider{border-top:1px solid var(--line);margin:16px 0}

/* notice */
.notice{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
.doc{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff;color:var(--ink2);line-height:20px}
.doc p{margin:0 0 8px}
.doc p:last-child{margin:0}
.doc .ln{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--ink)}
.facts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px}
.facts>div{padding:10px 12px;border-top:1px solid var(--line)}
.facts>div:first-child{border-top:0}
.facts small{display:block;font-size:12px;color:var(--mute);line-height:16px}
.facts span{display:flex;align-items:center;gap:6px}

.help-fab{position:fixed;right:12px;bottom:12px;height:28px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:12.5px;box-shadow:0 1px 3px rgba(28,28,24,.08)}

/* ===== screen 03: candidates table ===== */
.body3{flex:1;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr)}
.fp{border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.fsum{margin:12px;border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;gap:4px}
.fsum div{border-radius:8px;padding:6px 4px;text-align:center}
.fsum div.on{background:#EEF3FC}
.fsum b{display:block;font-weight:450}
.fsum span{display:inline-block;margin-top:2px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;line-height:16px;background:var(--chip);color:var(--ink2);border-radius:12px;padding:0 6px}
.fsum div.on span{background:#fff}
.acc{border-top:1px solid var(--line)}
.acc-h{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;font-weight:450}
.acc-h .i{color:var(--ink2)}
.acc-h .car{margin-left:auto;width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-top:5px solid var(--ink2)}
.acc.open .acc-h .car{transform:rotate(180deg)}
.acc-h .cnt{margin-left:auto;font-size:12px;color:var(--mute);font-weight:400}
.acc-h .cnt+.car{margin-left:8px}
.acc-b{padding:0 16px 12px;display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:center;gap:8px;height:28px;padding:0 4px;border-radius:6px}
.opt .n{margin-left:auto;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.fp-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;justify-content:center;align-items:center}
.fp-foot .ghost{color:var(--mute)}

.tw{display:flex;flex-direction:column;min-width:0;min-height:0}
.tbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.tbar .srch{display:flex;align-items:center;gap:8px;height:32px;width:240px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;color:var(--mute);background:#fff}
.tbar .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.sel-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--sub)}
.sel-bar .meta{margin-right:8px}
.sel-bar .btn{opacity:.5}
.tscroll{flex:1;overflow:auto;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:880px}
thead th{position:sticky;top:0;z-index:1;background:#fff;text-align:left;font-weight:450;font-size:12px;color:var(--mute);height:36px;padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th .lk{width:12px;height:12px;vertical-align:-2px;margin-left:4px;color:var(--faint)}
tbody td{height:52px;padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:hover td{background:#FCFCFB}
tbody tr.flag td{background:#FDFAF3}
td.cbx,th.cbx{width:40px;padding:0 0 0 16px}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.pav{width:28px;height:28px;border-radius:50%;background:var(--chip);color:var(--ink2);display:grid;place-items:center;font-size:11px;font-weight:550;flex:none}
.person b{display:block;font-weight:450;line-height:18px}
.person small{display:block;font-size:12px;color:var(--mute);line-height:16px}
.st{display:inline-flex;align-items:center;gap:6px}
.st i{width:7px;height:7px;border-radius:50%;flex:none}
.st.done i{background:var(--ink)}
.st.live i{background:#3E8E56;box-shadow:0 0 0 3px rgba(62,142,86,.18)}
.st.wait i{background:#B9B9AE}
.st.warn i{background:#C9821E}
.st.stop i{background:transparent;border:1.5px solid #B9B9AE}
.dim{color:var(--mute)}
.mono{font-variant-numeric:tabular-nums}
td.act{text-align:right}
.stage{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid var(--line2);border-radius:8px;background:var(--field);font-size:12.5px}
.req{display:inline-flex;align-items:center;gap:6px}
.pager{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:#fff}
.pager .meta{margin-right:auto}
.pg{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:8px;color:var(--ink2);background:var(--field)}
.foot-note{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
</style>
</style>
<style>
body.si-body{background:#FAFAF9;min-height:100%;height:auto}
.si-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:72px 16px 88px}
.si-logo{display:flex;align-items:center;gap:7px;font-size:20px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin-bottom:28px}
.si-logo i{width:9px;height:9px;border-radius:50%;background:#D97757;display:block}
.si-card{width:400px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 28px 24px;box-shadow:0 1px 2px rgba(28,28,24,.04)}
.si-card h1{margin:0 0 20px;font-size:20px;line-height:28px;font-weight:450}
.si-sub{margin:0 0 20px;color:var(--mute)}
.si-lab{display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:6px}
.si-in{width:100%;height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--field);font-size:13px}
.si-in:focus{outline:none;border-color:#2A4F99;box-shadow:0 0 0 3px rgba(42,79,153,.12)}
.si-stack{display:flex;flex-direction:column;gap:8px}
.si-card .btn{width:100%;height:34px;justify-content:center;gap:8px;font-weight:450}
.si-card .btn.yellow{font-weight:500}
.si-field{margin-bottom:16px}
.si-div{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--faint);font-size:12px}
.si-div::before,.si-div::after{content:"";flex:1;height:1px;background:var(--line)}
.si-below{width:400px;text-align:center;margin-top:20px;color:var(--mute)}
.si-below a{color:var(--ink);font-weight:500;text-decoration:none}
.si-below a:hover{text-decoration:underline}
.si-note{margin:8px 0 0;font-size:12px;line-height:18px;color:var(--mute)}
.si-foot{margin-top:auto;padding-top:40px;display:flex;gap:16px;font-size:12px}
.si-foot a{color:var(--mute);text-decoration:none}
.si-foot a:hover{color:var(--ink);text-decoration:underline}

.cd-lrow{display:flex;align-items:center;justify-content:space-between}
.cd-lrow .si-lab{margin-bottom:6px}
.cd-link{font-size:12px;color:var(--mute);margin-bottom:6px}
.cd-link:hover{color:var(--ink);text-decoration:underline}
.si-in.cd-bad{border-color:#B42318}
.cd-err{margin:6px 0 0;font-size:12px;line-height:16px;color:#B42318}
.cd-spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(28,28,24,.18);border-top-color:currentColor;animation:cd-rot .7s linear infinite;flex:none}
.btn.yellow .cd-spin{border-color:rgba(255,255,255,.3);border-top-color:#fff}
@keyframes cd-rot{to{transform:rotate(360deg)}}
.si-card.cd-busy .btn{pointer-events:none}
.si-card.cd-busy .btn:not(.cd-now){opacity:.5}
.cd-doc h3{font-size:13px;font-weight:550;margin:14px 0 4px}
.cd-doc h3:first-child{margin-top:0}
.cd-doc p{color:#535347}
.cd-doc .cd-upd{font-size:12px;color:#68685D;margin-top:12px}
.cd-ok{display:flex;gap:10px;align-items:flex-start}
.cd-ok span{width:24px;height:24px;border-radius:50%;background:#E2F2E6;color:#2B6B3E;display:grid;place-items:center;flex:none;font-weight:600}
</style>
</head>
<body class="si-body">
<main class="si-wrap">
  <div class="si-logo" aria-label="PM"><i aria-hidden="true"></i>PM</div>

  <section class="si-card" aria-labelledby="si-title">
    <h1 id="si-title">Sign in to PM</h1>

    <div class="si-stack">
      <button class="btn" type="button">
        <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 8h5.5M8 8V2.2"/></svg>
        Continue with Google
      </button>
      <button class="btn" type="button">
        <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx=".5"/><rect x="9" y="2.5" width="4.5" height="4.5" rx=".5"/><rect x="2.5" y="9" width="4.5" height="4.5" rx=".5"/><rect x="9" y="9" width="4.5" height="4.5" rx=".5"/></svg>
        Continue with Microsoft
      </button>
    </div>

    <div class="si-div" role="separator">or</div>

    <form id="cd-form" novalidate>
      <div class="si-field">
        <label class="si-lab" for="si-email">Work email</label>
        <input class="si-in" id="si-email" type="email" autocomplete="email" value="dana@northwindfreight.com">
      </div>
      <div class="si-field">
        <div class="cd-lrow"><label class="si-lab" for="si-pass">Password</label><button class="cd-link" type="button" id="cd-forgot">Forgot password?</button></div>
        <input class="si-in" id="si-pass" type="password" autocomplete="current-password" value="northwind-114">
        <p class="cd-err" id="cd-err" role="alert" hidden></p>
      </div>
      <div class="si-stack">
        <button class="btn yellow" type="submit" id="cd-submit">Sign in</button>
        <button class="btn" type="button">
          <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
          Sign in with SSO
        </button>
      </div>
    </form>
  </section>

  <div class="si-below">
    <div>New to PM? <a href="#" role="button">Book a demo</a></div>
    <p class="si-note">Candidates don't need an account. Use the link in your invite email.</p>
  </div>

  <nav class="si-foot" aria-label="Legal">
    <a href="#" role="button">Privacy</a>
    <a href="#" role="button">Terms</a>
    <a href="#" role="button">Accessibility</a>
  </nav>
</main>
<script src="ui.js"></script><script src="proto.js"></script>
<script>
(function(){
  var card=document.querySelector('.si-card');
  function busy(btn,label,ms,cb){
    card.classList.add('cd-busy');btn.classList.add('cd-now');
    var old=btn.innerHTML;btn.innerHTML='<span class="cd-spin" aria-hidden="true"></span>'+UI.esc(label);btn.setAttribute('aria-busy','true');
    setTimeout(function(){cb?cb():location.href='home.html';},ms||1100);
    return old;
  }
  var bs=document.querySelectorAll('.si-stack .btn');
  UI.wire(bs[0],function(b){busy(b,'Signing in with Google…');});
  UI.wire(bs[1],function(b){busy(b,'Signing in with Microsoft…');});
  var em=document.getElementById('si-email'),pw=document.getElementById('si-pass'),err=document.getElementById('cd-err');
  function fail(msg,el){err.textContent=msg;err.hidden=false;[em,pw].forEach(function(x){x.classList.toggle('cd-bad',x===el)});el.focus();}
  function clear(){err.hidden=true;em.classList.remove('cd-bad');pw.classList.remove('cd-bad');}
  em.addEventListener('input',clear);pw.addEventListener('input',clear);
  var sub=document.getElementById('cd-submit');sub.setAttribute('data-js','');
  document.getElementById('cd-form').addEventListener('submit',function(e){
    e.preventDefault();var v=em.value.trim();
    if(!v)return fail('Enter your work email.',em);
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))return fail('That email doesn’t look right. Check for a typo.',em);
    if(!pw.value)return fail('Enter your password.',pw);
    if(pw.value.length<8)return fail('That password is too short. Passwords are at least 8 characters.',pw);
    busy(sub,'Signing in…',800);
  });
  UI.wire(bs[3],function(b){
    var v=em.value.trim(),d=v.split('@')[1];
    if(!d||!/\./.test(d))return fail('Enter your work email first. We use it to find your company’s sign-in.',em);
    busy(b,'Opening '+d+' sign-in…',1300);
  });
  UI.wire('#cd-forgot',function(){
    UI.modal({title:'Reset your password',body:'<p>We’ll email you a link to set a new password. The link works for 30 minutes.</p><label for="cd-fe">Work email</label><input id="cd-fe" type="email" value="'+UI.esc(em.value)+'">',
      actions:[{label:'Cancel'},{label:'Send reset link',primary:true,onClick:function(m){var i=m.querySelector('input');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(i.value.trim())){i.style.borderColor='#B42318';i.focus();return false;}UI.toast('Sent a reset link to '+i.value.trim()+'.');}}]});
  });
  var DOCS={
    Privacy:['Privacy','<h3>What PM keeps</h3><p>For hiring teams: your name, work email and what you do in PM. For candidates: the notice they agreed to, their call recordings and transcripts, scores, and any accommodation requests.</p><h3>Who sees what</h3><p>Hiring managers see scores, recordings and transcripts. Accommodation requests go to recruiters only. Practice calls are never shared with anyone.</p><h3>How long</h3><p>Recordings are kept 12 months, then deleted. A candidate can ask the recruiter to delete theirs sooner.</p><h3>What PM never does</h3><p>PM doesn’t score voice, accent, face or pauses, and doesn’t sell or share candidate data.</p><p class="cd-upd">Last updated Sep 1, 2026 · privacy@pm.app</p>'],
    Terms:['Terms of use','<h3>Your account</h3><p>Accounts belong to your company. Your admin can add or remove people and change what they can see.</p><h3>Hiring decisions</h3><p>PM scores calls on the skills your team sets up. A person on your team makes every hiring decision. PM doesn’t reject or advance anyone on its own.</p><h3>Candidates</h3><p>You agree to show candidates the notice before their scored call, and to offer the accommodations they ask for.</p><h3>Audits</h3><p>You can export your role’s data for an independent bias audit at any time.</p><p class="cd-upd">Last updated Sep 1, 2026 · legal@pm.app</p>'],
    Accessibility:['Accessibility','<h3>What we support</h3><p>PM works with a keyboard and with screen readers. Text and controls meet WCAG 2.1 AA contrast.</p><h3>For candidates</h3><p>Every candidate can ask for extra time, live captions, a text version of the call or a person to interview them instead. Asking never affects their score.</p><h3>Tell us what’s not working</h3><p>Write to access@pm.app. We reply within two working days.</p><p class="cd-upd">Last reviewed Oct 2026</p>']
  };
  document.querySelectorAll('.si-foot a').forEach(function(a){var d=DOCS[a.textContent.trim()];UI.wire(a,function(){UI.modal({title:d[0],wide:true,body:'<div class="cd-doc">'+d[1]+'</div>'});});});
  UI.wire(UI.byText('Book a demo')[0],function(){
    var md=UI.modal({title:'Book a demo',body:'<p>We’ll walk you through PM with one of your open roles. It takes 30 minutes.</p><label for="cd-dn">Your name</label><input id="cd-dn" autocomplete="name"><label for="cd-de">Work email</label><input id="cd-de" type="email" autocomplete="email"><label for="cd-dc">Company</label><input id="cd-dc" autocomplete="organization"><label for="cd-dh">Sales hires in the next 12 months</label><select id="cd-dh"><option>1–5</option><option selected>6–20</option><option>21–50</option><option>More than 50</option></select><p class="cd-err" id="cd-derr" hidden></p>',
      actions:[{label:'Cancel'},{label:'Request a demo',primary:true,onClick:function(m){
        var n=m.querySelector('#cd-dn'),e=m.querySelector('#cd-de'),c=m.querySelector('#cd-dc'),er=m.querySelector('#cd-derr');
        [n,e,c].forEach(function(x){x.style.borderColor=''});
        var bad=!n.value.trim()?[n,'Add your name.']:!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e.value.trim())?[e,'Add a work email we can reply to.']:!c.value.trim()?[c,'Add your company.']:null;
        if(bad){bad[0].style.borderColor='#B42318';bad[0].focus();er.textContent=bad[1];er.hidden=false;return false;}
        var first=n.value.trim().split(' ')[0];
        m.querySelector('.ui-md-b').innerHTML='<div class="cd-ok"><span>✓</span><div><p><b>Thanks, '+UI.esc(first)+'.</b></p><p>We’ll email '+UI.esc(e.value.trim())+' within one working day with times for a 30-minute demo.</p></div></div>';
        var f=m.querySelector('.ui-md-f');f.innerHTML='';var b=document.createElement('button');b.className='ui-b pri';b.textContent='Done';b.onclick=function(){m.close();};f.appendChild(b);
        return false;}}]});
  });
})();
</script>

</body>
</html>
